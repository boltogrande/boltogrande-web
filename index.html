<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BOLTÓGRANDE presenta FLOR AL CUL, primer single. Dijous 26 de novembre a les 20h. Fes el pre-save.">
<title>BOLTÓGRANDE · FLOR AL CUL</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="ink"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter><filter id="ink-s"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.1"/></filter></svg>
<header class="site-header">
  <a class="home" href="/" aria-label="BOLTÓGRANDE, inici"><img src="assets/logo-boltogrande.webp" alt="BOLTÓGRANDE"></a>
  <nav aria-label="Navegació principal">
    <a href="concerts.html">Concerts</a>
    <a href="contacta.html">Contacta</a>
  </nav>
</header>
<main>
  <div class="release ink">
    <p>Primer single</p>
    <p>Dijous 26 · 20h</p>
    <h1>FLOR AL CUL</h1>
  </div>

  <img class="ill" src="assets/alter-ego-flor.webp" alt="Il·lustració de l'alter ego de BOLTÓGRANDE amb una flor">

  <a class="presave" href="https://orcd.co/floralcul" target="_blank" rel="noopener"><span>Pre-save</span></a>

  <p class="announce ink">NOU DISC<br>NOVA GIRA<br>2027</p>

  <footer class="ink-s">
    <a href="https://www.instagram.com/guillembolto" target="_blank" rel="noopener">@guillembolto</a>
  </footer>
</main>

<div id="pop" class="pop" role="dialog" aria-modal="true" aria-labelledby="pop-t" hidden>
  <div class="pop-card">
    <button class="pop-x" id="pop-x" type="button" aria-label="Tancar">×</button>
    <h2 id="pop-t" class="ink">FLOR AL CUL</h2>
    <p class="pop-sub ink">Nou single</p>
    <div id="cd" class="countdown" aria-live="polite">
      <div class="unit"><span class="num" id="d">00</span><span class="lbl">dies</span></div>
      <span class="sep">:</span>
      <div class="unit"><span class="num" id="h">00</span><span class="lbl">hores</span></div>
      <span class="sep">:</span>
      <div class="unit"><span class="num" id="m">00</span><span class="lbl">min</span></div>
      <span class="sep">:</span>
      <div class="unit"><span class="num" id="s">00</span><span class="lbl">seg</span></div>
    </div>
    <div id="out" class="out-now" hidden>Ja disponible!</div>
    <a class="presave" href="https://orcd.co/floralcul" target="_blank" rel="noopener"><span>Pre-save</span></a>
  </div>
</div>
<div id="flor" aria-hidden="true">🌸</div>
<script>
(function () {
  // Estrena: dijous 26 nov 2026, 20:00 hora peninsular (CET, UTC+1)
  var target = new Date("2026-11-26T20:00:00+01:00").getTime();
  var cd = document.getElementById("cd"), out = document.getElementById("out");
  var el = { d: document.getElementById("d"), h: document.getElementById("h"), m: document.getElementById("m"), s: document.getElementById("s") };
  function pad(n) { return String(n).padStart(2, "0"); }
  function tick() {
    var diff = target - Date.now();
    if (diff <= 0) { cd.hidden = true; out.hidden = false; return; }
    var t = Math.floor(diff / 1000);
    el.d.textContent = pad(Math.floor(t / 86400));
    el.h.textContent = pad(Math.floor(t % 86400 / 3600));
    el.m.textContent = pad(Math.floor(t % 3600 / 60));
    el.s.textContent = pad(t % 60);
  }
  tick(); setInterval(tick, 1000);

  // Pop-up del compte enrere: s'obre en carregar
  var pop = document.getElementById("pop"), lastFocus = null;
  function openPop() { lastFocus = document.activeElement; pop.hidden = false; document.getElementById("pop-x").focus(); }
  function closePop() { pop.hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  document.getElementById("pop-x").addEventListener("click", closePop);
  pop.addEventListener("click", function (e) { if (e.target === pop) closePop(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) closePop(); });
  setTimeout(openPop, 700);
})();
</script>
<script src="flor.js"></script>
</body>
</html>
