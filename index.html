main {
  max-width: 720px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 48px 72px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 44px;
  text-align: center;
}
main img { display: block; height: auto; max-width: 100%; }
.title { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(38px, 9vw, 64px); line-height: .9; letter-spacing: -.035em; }
.logo { width: min(100%, 640px); }
.release { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.release p { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(20px, 4.4vw, 28px); line-height: 1; letter-spacing: -.025em; text-transform: uppercase; }
.ink { filter: url(#ink); }
.ink-s { filter: url(#ink-s); }
h1 {
  font-family: var(--display); font-weight: 700; margin: 6px 0 0;
  font-size: clamp(48px, 12vw, 100px); line-height: .88; letter-spacing: -.035em;
  text-wrap: balance;
}
.ill { width: min(55%, 220px); animation: sway 5s ease-in-out infinite; transform-origin: 50% 100%; }
@media (max-width: 600px) {
  main { gap: 28px; padding-block: 32px 48px; }
  .ill { width: 130px; }
}
@keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }

.countdown { display: flex; align-items: flex-start; justify-content: center; gap: clamp(6px, 2vw, 14px); }
.countdown { background: #44a828; color: #fff; border-radius: 22px; padding: clamp(16px, 3.5vw, 28px) clamp(16px, 4.5vw, 40px) clamp(14px, 3vw, 22px); max-width: 100%; box-sizing: border-box; }
.countdown .sep, .countdown .lbl { color: var(--ink); }
.unit { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.num {
  font-family: var(--display); font-weight: 700; font-size: clamp(48px, 13vw, 96px); line-height: .88;
  letter-spacing: -.03em; font-variant-numeric: tabular-nums;
}
.sep { font-family: var(--display); font-weight: 700; font-size: clamp(36px, 10vw, 72px); line-height: .95; }
.lbl { font-size: 13px; font-weight: 700; letter-spacing: -.02em; text-transform: uppercase; }
.out-now { font-family: var(--display); font-weight: 700; font-size: clamp(36px, 9vw, 64px); letter-spacing: -.03em; }

.presave {
  display: inline-block;
  font-family: var(--display); font-weight: 700; font-size: clamp(19px, 4.4vw, 23px); letter-spacing: -.02em; text-transform: uppercase;
  text-decoration: none;
  background: var(--btn-bg); color: var(--btn-fg);
  border: 0; border-radius: 999px;
  padding: 16px 44px;
  transition: background-color .2s ease, color .2s ease, box-shadow .2s ease;
}
.presave:hover { background: var(--btn-hbg); color: var(--btn-hfg); box-shadow: inset 0 0 0 3px var(--btn-hfg); }
.presave span { display: inline-block; filter: url(#ink); }
.presave:focus-visible { outline: 3px solid var(--fg); outline-offset: 5px; }

footer { font-size: 14px; font-weight: 700; letter-spacing: -.03em; display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 8px; }
.announce { margin: 8px 0 0; font-family: var(--display); font-weight: 700; font-size: clamp(44px, 11vw, 84px); line-height: .88; letter-spacing: -.035em; }
footer a { color: var(--fg); }

#flor, .petal { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 100; font-size: 34px; line-height: 1; user-select: none; will-change: transform; }
#flor { display: none; }
.petal { font-size: 22px; }
@media (pointer: fine) {
  html.flor-on, html.flor-on * { cursor: none !important; }
  html.flor-on #flor { display: block; }
}
@media (prefers-reduced-motion: reduce) { .ill { animation: none; } }

.pop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(13, 20, 9, .55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fadein .25s ease; }

.pop-card h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(42px, 11vw, 72px); line-height: .88; letter-spacing: -.035em; }

.pop-card .num, .pop-card .sep { filter: url(#ink); }

.pop-card .sep { font-size: clamp(30px, 8vw, 52px); }
.pop-card .presave { margin-top: 6px; }
.pop-card .countdown { background: var(--ink); color: #fff; }
.pop-card .countdown .sep, .pop-card .countdown .lbl { color: #6fd84a; }

.pop-card .presave:hover { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 3px var(--ink); }
.pop-x { position: absolute; top: 10px; right: 14px; width: 40px; height: 40px; border: 0; background: transparent; color: var(--fg);
  font: 700 34px/1 var(--display); cursor: pointer; border-radius: 50%; }
.pop-x:hover { background: rgba(13,20,9,.12); }
.pop-x:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
@keyframes fadein { from { opacity: 0; } }
@keyframes popin { from { opacity: 0; transform: translateY(16px) scale(.96); } }
@media (prefers-reduced-motion: reduce) { .pop, .pop-card { animation: none; } }

<script>
(function () {
  // Estrena: dijous 26 nov 2026, 20:00 hora peninsular (CET, UTC+1)
  var target = new Date("2026-11-26T20:00:00+01:00").getTime();
  var cd = document.getElementById("cd"), out = document.getElementById("out");
  var el = { d: document.getElementById("d"), h: document.getElementById("h"), m: document.getElementById("m"), s: document.getElementById("s") };
  function pad(n) { return String(n).padStart(2, "0"); }
  function tick() {
    var diff = target - Date.now();
    if (diff <= 0) { cd.hidden = true; out.hidden = false; return; }
    var t = Math.floor(diff / 1000);
    el.d.textContent = pad(Math.floor(t / 86400));
    el.h.textContent = pad(Math.floor(t % 86400 / 3600));
    el.m.textContent = pad(Math.floor(t % 3600 / 60));
    el.s.textContent = pad(t % 60);
  }
  tick(); setInterval(tick, 1000);

  // Pop-up del compte enrere: s'obre en carregar
  var pop = document.getElementById("pop"), lastFocus = null;
  function openPop() { lastFocus = document.activeElement; pop.hidden = false; document.getElementById("pop-x").focus(); }
  function closePop() { pop.hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  document.getElementById("pop-x").addEventListener("click", closePop);
  pop.addEventListener("click", function (e) { if (e.target === pop) closePop(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) closePop(); });
  setTimeout(openPop, 700);

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!window.matchMedia("(pointer: fine)").matches) return;
  var flor = document.getElementById("flor");
  var mx = -100, my = -100, x = -100, y = -100, vx = 0, vy = 0, rot = 0, scale = 1, targetScale = 1, started = false;
  document.addEventListener("pointermove", function (e) {
    mx = e.clientX; my = e.clientY;
    if (!started) { started = true; x = mx; y = my; document.documentElement.classList.add("flor-on"); }
  });
  document.addEventListener("pointerleave", function () { flor.style.opacity = 0; });
  document.addEventListener("pointerenter", function () { flor.style.opacity = 1; });
  document.addEventListener("pointerover", function (e) { targetScale = e.target.closest("a, button") ? 1.6 : 1; });
  function frame(time) {
    if (reduce) { x = mx; y = my; }
    else { vx = (vx + (mx - x) * 0.18) * 0.62; vy = (vy + (my - y) * 0.18) * 0.62; x += vx; y += vy; }
    var spin = reduce ? 0 : Math.sin(time / 380) * 10;
    rot += ((vx * 2.2) - rot) * 0.15;
    scale += (targetScale - scale) * 0.2;
    flor.style.transform = "translate(" + (x - 17) + "px," + (y - 17) + "px) rotate(" + (rot + spin) + "deg) scale(" + scale + ")";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (reduce) return;
  var kinds = ["🌸", "🌷", "🌸", "🌼"];
  document.addEventListener("pointerdown", function (e) { for (var i = 0; i < 7; i++) spawn(e.clientX, e.clientY); });
  function spawn(px, py) {
    var p = document.createElement("div");
    p.className = "petal"; p.textContent = kinds[Math.floor(Math.random() * kinds.length)];
    document.body.appendChild(p);
    var a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 5;
    var dx = Math.cos(a) * sp, dy = Math.sin(a) * sp - 4, r = 0, dr = (Math.random() - .5) * 20, life = 0;
    (function step() {
      life++; dy += 0.35; px += dx; py += dy; r += dr;
      p.style.transform = "translate(" + (px - 11) + "px," + (py - 11) + "px) rotate(" + r + "deg)";
      p.style.opacity = Math.max(0, 1 - life / 60);
      if (life < 60) requestAnimationFrame(step); else p.remove();
    })();
  }
})();
</script>
